# Dependabot configuration — https://docs.github.com/code-security/dependabot
# Security updates (auto-PRs for known CVEs) are enabled separately in repo
# Settings and do NOT require this file.
#
# VERSION-UPDATE PRs ARE INTENTIONALLY OFF (open-pull-requests-limit: 0).
# The public repository is a downstream force-synced snapshot of the private
# tree: PRs opened against it can never be merged in place, so scheduled bump
# PRs here only generate un-mergeable noise (see the closed #1/#31–#34).
# Dependency bumps are applied deliberately in the upstream tree and arrive
# with each mirror refresh. Limits stay declared (rather than deleting the
# file) so this policy is visible and this comment survives.
#
# Note: mops (Motoko: core/json/sha2) has no Dependabot ecosystem — tracked
# manually via `mops outdated`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
